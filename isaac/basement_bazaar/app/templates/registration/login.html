{% extends 'base.html' %}
{% block title %}Entrar &mdash; Basement Bazaar{% endblock %}

{% block content %}
<section class="container secao">
  <div class="caixa caixa-estreita form-isaac">
    <h1 class="mb-4">Entrar</h1>

    <form method="post">
      {% csrf_token %}
      {{ form }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-isaac w-100 mt-4">Entrar</button>
    </form>

    <p class="mt-4 mb-0 text-body-secondary">
      Ainda não tem conta? <a href="{% url 'cadastro' %}" class="link-osso">Criar conta</a>
    </p>
  </div>
</section>
{% endblock %}
